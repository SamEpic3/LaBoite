<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b4f3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="La boîte">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>La boîte — Multijoueur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icone-192.png">
</head>
<body>
    <div class="barre-haut"></div>
    <div class="ecran" id="accueil">
        <h1>Multijoueur</h1>
        <div class="carte-menu">
            <label>Ton nom
                <input id="nom" maxlength="14" autocomplete="off" autocapitalize="words">
            </label>
        </div>
        <div class="carte-menu">
            <strong>Parties ouvertes</strong>
            <ul class="liste-parties" id="liste-parties"></ul>
            <p class="petit" id="aucune-partie">Recherche des parties…</p>
        </div>
        <div class="carte-menu">
            <strong>Créer une partie</strong>
            <label>Mot de passe (facultatif)
                <input id="mdp-creer" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false"
                       placeholder="Vide = ouverte à tous">
            </label>
            <button id="btn-creer">Créer la partie</button>
        </div>
        <p class="erreur cache" id="erreur-accueil"></p>
        <p class="petit" id="etat-connexion"></p>
        <button class="secondaire" onclick="location.href = 'index.html'">Retour</button>
    </div>

    <div class="ecran cache" id="attente">
        <h1 id="titre-salle">Salle d'attente</h1>
        <div class="carte-menu">
            <p class="petit cache" id="salle-protegee">🔒 Partie protégée par un mot de passe</p>
            <button class="secondaire" id="btn-partager">Copier le lien d'invitation</button>
            <strong>Joueurs</strong>
            <ul class="liste-joueurs" id="liste-joueurs"></ul>
            <div id="options-hote">
                <label>Nombre de joueurs (les places libres vont à l'ordinateur)
                    <select id="nb"></select>
                </label>
                <label style="margin-top: 10px;">La partie finit à
                    <select id="pts">
                        <option value="100">100 points</option>
                        <option value="200">200 points</option>
                        <option value="300">300 points</option>
                        <option value="500">500 points</option>
                    </select>
                </label>
            <label style="margin-top: 10px;">Niveau des joueurs ordinateur
                <select id="difficulte">
                    <option value="facile">Facile</option>
                    <option value="normal" selected>Normal</option>
                    <option value="difficile">Difficile</option>
                </select>
            </label>
                <label style="margin-top: 10px;">Temps pour jouer chaque tour
                    <select id="delai">
                        <option value="0">Illimité</option>
                        <option value="15">15 secondes</option>
                        <option value="30">30 secondes</option>
                        <option value="60">1 minute</option>
                    </select>
                </label>
            <details class="carte-menu" style="margin-top: 12px; padding: 12px 14px; background: rgba(0,0,0,0.15);">
                <summary>Variantes de règles</summary>
                <div class="options" style="margin-top: 10px;">
                    <label>La boîte vaut
                        <select id="r-boite">
                            <option value="20">20 points</option>
                            <option value="10">10 points</option>
                            <option value="30">30 points</option>
                            <option value="50">50 points</option>
                        </select>
                    </label>
                    <label>L'as vaut
                        <select id="r-as">
                            <option value="15">15 points</option>
                            <option value="1">1 point</option>
                        </select>
                    </label>
                    <label style="grid-column: 1 / -1;">Celui qui finit la manche
                        <select id="r-bonus">
                            <option value="0">marque 0 point</option>
                            <option value="10">retire 10 points</option>
                            <option value="20">retire 20 points</option>
                        </select>
                    </label>
                </div>
            </details>
            </div>
            <p class="petit" id="resume-config"></p>
            <button id="btn-demarrer">Démarrer la partie</button>
            <p class="petit cache" id="attente-hote">En attente que l'hôte démarre la partie…</p>
        </div>
        <button class="secondaire" id="btn-quitter">Quitter la partie</button>
    </div>

    <div id="jeu" class="cache"></div>

    <script src="js/regles.js"></script>
    <script src="js/rendu.js"></script>
    <script src="js/sons.js"></script>
    <script src="js/client.js"></script>
    <script src="multi.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
