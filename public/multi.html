<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d5f4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="La boîte">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>La boîte — Multijoueur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icone-192.png">
</head>
<body>
    <div class="barre-haut"></div>
    <div class="ecran" id="accueil">
        <h1>Multijoueur</h1>
        <div class="carte-menu">
            <label>Ton nom
                <input id="nom" maxlength="14" autocomplete="off" autocapitalize="words">
            </label>
        </div>
        <div class="carte-menu">
            <strong>Parties ouvertes</strong>
            <ul class="liste-parties" id="liste-parties"></ul>
            <p class="petit" id="aucune-partie">Recherche des parties…</p>
        </div>
        <div class="carte-menu">
            <strong>Créer une partie</strong>
            <label>Mot de passe (facultatif)
                <input id="mdp-creer" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false"
                       placeholder="Vide = ouverte à tous">
            </label>
            <button id="btn-creer">Créer la partie</button>
        </div>
        <p class="erreur cache" id="erreur-accueil"></p>
        <p class="petit" id="etat-connexion"></p>
        <button class="secondaire" onclick="location.href = 'index.html'">Retour</button>
    </div>

    <div class="ecran cache" id="attente">
        <h1 id="titre-salle">Salle d'attente</h1>
        <div class="carte-menu">
            <p class="petit cache" id="salle-protegee">🔒 Partie protégée par un mot de passe</p>
            <button class="secondaire" id="btn-partager">Copier le lien d'invitation</button>
            <strong>Joueurs</strong>
            <ul class="liste-joueurs" id="liste-joueurs"></ul>
            <div id="options-hote">
                <label>Nombre de joueurs (les places libres vont à l'ordinateur)
                    <select id="nb"></select>
                </label>
                <label style="margin-top: 10px;">La partie finit à
                    <select id="pts">
                        <option value="100">100 points</option>
                        <option value="200">200 points</option>
                        <option value="300">300 points</option>
                        <option value="500">500 points</option>
                    </select>
                </label>
            </div>
            <p class="petit" id="resume-config"></p>
            <button id="btn-demarrer">Démarrer la partie</button>
            <p class="petit cache" id="attente-hote">En attente que l'hôte démarre la partie…</p>
        </div>
        <button class="secondaire" id="btn-quitter">Quitter la partie</button>
    </div>

    <div id="jeu" class="cache"></div>

    <script src="js/regles.js"></script>
    <script src="js/rendu.js"></script>
    <script src="js/client.js"></script>
    <script src="multi.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
