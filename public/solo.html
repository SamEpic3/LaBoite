<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b4f3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="La boîte">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>La boîte — Solo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icone-192.png">
</head>
<body>
    <div class="barre-haut"></div>
    <div class="ecran" id="menu">
        <h1>Solo</h1>
        <form class="carte-menu" id="form-solo">
            <label>Ton nom
                <input id="nom" maxlength="14" required autocomplete="off">
            </label>
            <label>Nombre de joueurs (toi + l'ordinateur)
                <select id="nb">
                    <option>2</option><option>3</option><option selected>4</option><option>5</option>
                    <option>6</option><option>7</option><option>8</option>
                </select>
            </label>
            <label>La partie finit à
                <select id="pts">
                    <option value="100">100 points</option>
                    <option value="200" selected>200 points</option>
                    <option value="300">300 points</option>
                    <option value="500">500 points</option>
                </select>
            </label>
            <label>Niveau des joueurs ordinateur
                <select id="difficulte">
                    <option value="facile">Facile</option>
                    <option value="normal" selected>Normal</option>
                    <option value="difficile">Difficile</option>
                </select>
            </label>
            <details class="carte-menu" style="padding: 12px 14px; background: rgba(0,0,0,0.15);">
                <summary>Variantes de règles</summary>
                <div class="options" style="margin-top: 10px;">
                    <label>La boîte vaut
                        <select id="r-boite">
                            <option value="20">20 points</option>
                            <option value="10">10 points</option>
                            <option value="30">30 points</option>
                            <option value="50">50 points</option>
                        </select>
                    </label>
                    <label>L'as vaut
                        <select id="r-as">
                            <option value="15">15 points</option>
                            <option value="1">1 point</option>
                        </select>
                    </label>
                    <label style="grid-column: 1 / -1;">Celui qui finit la manche
                        <select id="r-bonus">
                            <option value="0">marque 0 point</option>
                            <option value="10">retire 10 points</option>
                            <option value="20">retire 20 points</option>
                        </select>
                    </label>
                </div>
            </details>
            <button type="submit">Démarrer la partie</button>
        </form>
        <button class="secondaire" onclick="location.href = 'index.html'">Retour</button>
    </div>
    <div id="jeu" class="cache"></div>

    <script src="js/regles.js"></script>
    <script src="js/hote.js"></script>
    <script src="js/rendu.js"></script>
    <script src="js/sons.js"></script>
    <script src="js/client.js"></script>
    <script src="solo.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
